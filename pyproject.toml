[project]
name = "finsight"
version = "0.0.0"
description = "IPO X-Ray for Indian retail investors: RHP to cited fact sheet plus chat with number verification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

# Dependency groups (ADR-029). `uv sync` installs the default groups below;
# add `--group ml` or `--group asr` when you need them. CI installs dev + api only.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "poethepoet>=0.29",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "httpx2>=2.13.1",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.32",
    "bm25s>=0.3.11",
    "numpy>=2.4.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]
# Offline pipeline, Kaggle and the laptop GPU. Never installed in CI or the deploy image.
ml = [
    "torch>=2.4",
    "transformers>=4.44",
]
asr = [
    "faster-whisper>=1.0",
]
# CPU-only classical ML: the TF-IDF + logistic-regression risk-category baseline (B2.4).
ml-cpu = [
    "scikit-learn>=1.5",
]
# ONNX int8 inference on the CPU worker (risk classifier, B2.4) and the reranker experiment.
# `tokenizers` reads the exported tokenizer.json without transformers or torch.
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]
data = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]
tables = [
    "docling>=2.131.0",
]
# Google Cloud clients for the cloud profiles (GCS signed URLs); tests use a fake client.
cloud = [
    "google-cloud-storage>=2.18",
]

[tool.uv]
default-groups = ["dev", "api", "data", "ml-cpu"]

# CUDA 12.8 wheels for the RTX 2050 (Ampere). Only resolved when the `ml` group is requested.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.poe.tasks]
test = { cmd = "pytest -m 'not slow and not local and not postgres'", help = "Fast tests (no real models, no full documents, no Postgres); what CI and cloud sessions run" }
test-all = { cmd = "pytest", help = "All tests including slow (real models)" }
fmt = { sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }], help = "Auto-fix and format" }
typecheck = { cmd = "mypy -p finsight.core -p finsight.normalize -p finsight.verify -p finsight.storage -p finsight.db -p finsight.auth -p finsight.reports -p finsight.jobs", help = "mypy on the correctness-critical packages" }
api = { cmd = "uvicorn finsight.api.app:app --reload --port 8000 --timeout-keep-alive 30", help = "FastAPI on :8000" }
record-demo = { cmd = "python scripts/record_demo.py", help = "Record real chat streams into data/demo_cache (needs Ollama)" }
gen-openapi = { cmd = "python scripts/gen_openapi.py", help = "Write openapi.json (add --check to verify it is current)" }

[tool.poe.tasks.lint]
help = "ruff check and format check"
sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "docs", "models", "frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF"]
# Rupee signs, the placeholder bullet and Devanagari are intentional in strings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Long user-facing help sentences in the labelling sheet read better unwrapped.
"src/finsight/evaluate/gold_xlsx.py" = ["E501"]
# Regex rule tables: one rule per line is easier to audit than wrapped patterns.
"src/finsight/guard/advice.py" = ["E501"]
"src/finsight/guard/privacy.py" = ["E501"]
"src/finsight/generate/postprocess.py" = ["E501"]
"src/finsight/retrieve/boost.py" = ["E501"]
# Dense fixture builders: one record per line reads better than wrapped keyword arguments.
"tests/api/test_endpoints.py" = ["E501"]
# One-off experiment and data scripts keep long f-strings and table rows readable.
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

# Strict where correctness matters most (CLAUDE.md, 04 section 3).
[[tool.mypy.overrides]]
module = ["finsight.core.*", "finsight.normalize.*", "finsight.verify.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: uses real models or large data; skipped by `poe test`, run by `poe test-all`",
    "local: needs data/processed, full PDFs, the corpus or model weights (laptop only); skipped by `poe test`",
    "postgres: needs a Postgres server (CI service job); skipped by `poe test`",
]

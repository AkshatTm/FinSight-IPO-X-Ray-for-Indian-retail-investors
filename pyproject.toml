[project]
name = "finsight"
version = "0.0.0"
description = "IPO X-Ray for Indian retail investors: RHP to cited fact sheet plus chat with number verification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

# Dependency groups (ADR-029). `uv sync` installs the default groups below;
# add `--group ml` or `--group asr` when you need them. CI installs dev + api only.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "poethepoet>=0.29",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "httpx2>=2.13.1",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.32",
]
# Offline pipeline, Kaggle and the laptop GPU. Never installed in CI or the deploy image.
ml = [
    "torch>=2.4",
    "transformers>=4.44",
]
asr = [
    "faster-whisper>=1.0",
]
data = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]
tables = [
    "docling>=2.131.0",
]

[tool.uv]
default-groups = ["dev", "api", "data"]

# CUDA 12.8 wheels for the RTX 2050 (Ampere). Only resolved when the `ml` group is requested.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.poe.tasks]
test = { cmd = "pytest -m 'not slow'", help = "Fast tests (no real models)" }
test-all = { cmd = "pytest", help = "All tests including slow (real models)" }
fmt = { sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }], help = "Auto-fix and format" }
typecheck = { cmd = "mypy -p finsight.core -p finsight.normalize -p finsight.verify", help = "mypy on the correctness-critical packages" }
api = { cmd = "uvicorn finsight.api.app:app --reload --port 8000", help = "FastAPI on :8000" }
gen-openapi = { cmd = "python scripts/gen_openapi.py", help = "Write openapi.json (add --check to verify it is current)" }

[tool.poe.tasks.lint]
help = "ruff check and format check"
sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", "docs", "models", "frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF"]
# Rupee signs, the placeholder bullet and Devanagari are intentional in strings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Long user-facing help sentences in the labelling sheet read better unwrapped.
"src/finsight/evaluate/gold_xlsx.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

# Strict where correctness matters most (CLAUDE.md, 04 section 3).
[[tool.mypy.overrides]]
module = ["finsight.core.*", "finsight.normalize.*", "finsight.verify.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: uses real models or large data; skipped by `poe test`, run by `poe test-all`",
]

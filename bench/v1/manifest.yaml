disclosures:
- 'Bench documents are the 7 test-slice showcase IPOs (all 2025): the only test IPOs whose gold is verified
  by Akshat. The 4 newest 2026 IPOs of C04 §2 need gold v4 first (bench v2).'
- 2025 IPOs may be in frontier models' training data (contamination helps them on facts).
- 'No bench-dev: error analysis on bench items is descriptive; any fix it motivates is disclosed as test-informed
  (C04 §7).'
- Every system gets the same retrieved passages and prompt text; frontier models do not get the PDF (C04
  §1 ladder not used), so the bench compares readers of the same context.
- Task B is computed by the same rule engine from each system's Task A answers, so it measures extraction
  for every system; rules/v1's statuses come from the engine the gold was built with (structurally easier
  for FinSight).
- Task C keys are gold v3 values (verified); questions and the 3 unanswerable ones per IPO were written
  by Claude Code from templates, not by Akshat.
- Single run per system (temperature 0 for local and teacher; app defaults for frontier apps).
- Akshat built FinSight and is the single rater in C4.4.
- scripts/summary_eval.py changed on main (gold v3.1 convention option, C-ADR-22) after the freeze and
  before any scoring; its default v3 rules, which the bench uses, are unchanged, and its hash was re-recorded.
- Keys are gold v3 (every row Akshat-verified); gold v3.1 (C-ADR-22) landed after the build and still
  has rows waiting for his check.

name: docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# B09 §9. Hard checks: generated pages and openapi.json are current (the page check also runs
# in pytest), the strict site build, and the 70 % docstring floor. Warn-only: the 80 % docstring
# target and Markdown lint. Publishing to GitHub Pages is added after Akshat's go.
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group docs
      - name: Generated reference pages are current
        run: uv run poe docs-gen --check
      - name: openapi.json is current
        run: uv run poe gen-openapi --check
      - name: Build the site (strict)
        run: uv run poe docs-build
      - name: Docstring coverage floor (70 %)
        run: uv run interrogate src/finsight
      - name: Docstring coverage target (80 %, warn-only)
        continue-on-error: true
        run: uv run interrogate src/finsight --fail-under 80
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Markdown lint on the site sources (warn-only)
        continue-on-error: true
        run: npx -y markdownlint-cli2@0.23.3 docs/index.md "docs/reference/*.md" "docs/adr/*.md"

name: docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# B09 §9. Hard checks: generated pages and openapi.json are current (the page check also runs
# in pytest), the strict site build, the 70 % docstring floor and Markdown lint on the site
# sources. Warn-only: the 80 % docstring target. Publishing to GitHub Pages is added after
# Akshat's go.
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group docs
      - name: Generated reference pages are current
        run: uv run poe docs-gen --check
      - name: openapi.json is current
        run: uv run poe gen-openapi --check
      - name: Build the site (strict)
        run: uv run poe docs-build
      - name: Docstring coverage floor (70 %)
        run: uv run interrogate src/vidura
      - name: Docstring coverage target (80 %, warn-only)
        continue-on-error: true
        run: uv run interrogate src/vidura --fail-under 80
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Links in every Markdown file resolve
        run: uv run python scripts/check_links.py
      - name: README results table is current
        run: uv run python scripts/readme_results.py --check
      - name: Markdown lint on the site sources
        run: >-
          npx -y markdownlint-cli2@0.23.3 README.md docs/index.md docs/glossary.md docs/evaluation.md docs/faq.md
          docs/history.md "docs/getting-started/*.md" "docs/user-guide/*.md" "docs/architecture/*.md"
          "docs/data/*.md" "docs/evaluation/*.md" "docs/development/*.md" "docs/operations/*.md"
          "docs/reference/*.md" "docs/adr/*.md" "docs/model_cards/*.md" "docs/datasheets/*.md"
          CHANGELOG.md CONTRIBUTING.md SECURITY.md PRIVACY.md CODE_OF_CONDUCT.md frontend/README.md

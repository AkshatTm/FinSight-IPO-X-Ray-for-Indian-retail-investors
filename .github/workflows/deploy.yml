name: deploy

# B3.3a: lint the Dockerfiles and workflows, build the two CPU images and run the smoke test
# against the API container. Nothing is pushed or deployed from here (images.yml is manual).
on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "configs/**"
      - "scripts/cloud_smoke.py"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        run: |
          curl -sSfL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold warning deploy/*.Dockerfile
      - name: actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color
      - name: shellcheck
        run: shellcheck deploy/gpu_entrypoint.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The L4 GPU image (deploy/gpu.Dockerfile) is CUDA + vLLM, too large for PR CI: lint only.
      - name: build the CPU images
        run: |
          docker build -f deploy/api.Dockerfile -t finsight-api:ci .
          docker build -f deploy/worker.Dockerfile -t finsight-worker:ci .
      - name: API and worker imports (catches wheels built for the wrong libc)
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python finsight-api:ci -c \
            "import llama_cpp, pymupdf; import finsight.api.app"
          docker run --rm --entrypoint /app/.venv/bin/python finsight-worker:ci -c \
            "import onnxruntime, sklearn, pyarrow, pymupdf, llama_cpp; import finsight.jobs.__main__"
      - name: start the API container (local profile)
        run: |
          docker run -d --name api -p 8080:8080 -e FINSIGHT_PROFILE=dev_light finsight-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health >/dev/null && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: smoke test (synthetic RHP)
        run: uv run python scripts/cloud_smoke.py --base-url http://localhost:8080 --synthetic --timeout 120
      - if: failure()
        run: docker logs api

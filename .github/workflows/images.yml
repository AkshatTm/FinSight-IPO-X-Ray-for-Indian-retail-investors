name: images

# B3.3a: build and push the images to Artifact Registry. MANUAL ONLY, and only after GCP billing
# exists and Akshat has said "go" (B3.3b). No keys: GitHub signs in to Google Cloud with Workload
# Identity Federation. The provider and service account are repository *variables* (not
# secrets), set once in docs/runbooks/DEPLOY_RUNBOOK.md step 4.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image"
        type: choice
        options: [api, worker, gpu-worker, cpu-both]
        default: cpu-both
      tag:
        description: "Image tag (e.g. v2026-10-12 or a short sha)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.GCP_REGION || 'asia-southeast1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/finsight
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
      - name: build and push
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          build() {
            docker build -f "deploy/$2.Dockerfile" -t "$REGISTRY/$1:$TAG" .
            docker push "$REGISTRY/$1:$TAG"
          }
          case "$IMAGE" in
            api) build api api ;;
            worker) build worker worker ;;
            gpu-worker) build gpu-worker gpu ;;
            cpu-both) build api api && build worker worker ;;
          esac

name: Feature or improvement
description: A new red-flag check, report section, evaluation or docs change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Vidura explains offer documents; it never gives investment advice or predictions. Requests for buy / sell / apply / avoid ratings will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a reader of an offer document cannot do or see today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Vidura should do, and where in the offer document the information comes from.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How we would know it works
      description: A test, a gold set, or a metric from eval_results/.

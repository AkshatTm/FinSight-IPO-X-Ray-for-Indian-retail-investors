# Cloud Run job on an NVIDIA L4 (optional cloud_gpu profile, B3.3a, B02 §10.3).
# Needs GPU quota in the region (asia-southeast1 has L4; Mumbai L4 is invitation-only) and billing.
# The GCP free-trial credit does not cover GPUs. Only with Akshat's "go".
# Fill the ${...} names with envsubst, then: gcloud run jobs replace <rendered>.yaml
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: finsight-gpu-worker
  labels:
    cloud.googleapis.com/location: ${GCP_REGION}
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: finsight-worker@${GCP_PROJECT}.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: 1800
          nodeSelector:
            run.googleapis.com/accelerator: nvidia-l4
          containers:
            - image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/finsight/gpu-worker:${IMAGE_TAG}
              resources:
                limits:
                  cpu: "4"
                  memory: 16Gi     # the L4 minimum
                  nvidia.com/gpu: "1"
              env:
                - { name: FINSIGHT_PROFILE, value: cloud_gpu }
                - { name: FINSIGHT_STORAGE__BUCKET, value: "${FINSIGHT_BUCKET}" }
                - { name: GCP_PROJECT, value: "${GCP_PROJECT}" }
                - { name: GCP_REGION, value: "${GCP_REGION}" }
                - name: FINSIGHT_DB__URL
                  valueFrom:
                    secretKeyRef: { name: finsight-db-url, key: latest }
              volumeMounts:
                - { name: models, mountPath: /models }
          volumes:
            - name: models
              csi:
                driver: gcsfuse.run.googleapis.com
                readOnly: true
                volumeAttributes: { bucketName: "${FINSIGHT_BUCKET}", mountOptions: "only-dir=models" }

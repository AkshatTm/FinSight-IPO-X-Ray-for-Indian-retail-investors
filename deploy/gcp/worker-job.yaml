# Cloud Run job: the CPU worker, one execution per document (B3.3a, B02 §10).
# The API starts it through the Run Admin API with DOC_ID / JOB_ID overrides (jobs.launcher).
# Fill the ${...} names with envsubst, then: gcloud run jobs replace <rendered>.yaml
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: finsight-worker
  labels:
    cloud.googleapis.com/location: ${GCP_REGION}
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: finsight-worker@${GCP_PROJECT}.iam.gserviceaccount.com
          maxRetries: 0            # a failed stage is recorded; the reader sees a partial report
          timeoutSeconds: 3600
          containers:
            - image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/finsight/worker:${IMAGE_TAG}
              args: ["run"]
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi      # 1,500-page PDFs + the GGUF student
              env:
                - { name: FINSIGHT_PROFILE, value: cloud }
                - { name: FINSIGHT_STORAGE__BUCKET, value: "${FINSIGHT_BUCKET}" }
                - { name: GCP_PROJECT, value: "${GCP_PROJECT}" }
                - { name: GCP_REGION, value: "${GCP_REGION}" }
                - name: FINSIGHT_DB__URL
                  valueFrom:
                    secretKeyRef: { name: finsight-db-url, key: latest }
              volumeMounts:
                - { name: models, mountPath: /models }
          volumes:
            - name: models
              csi:
                driver: gcsfuse.run.googleapis.com
                readOnly: true
                volumeAttributes: { bucketName: "${FINSIGHT_BUCKET}", mountOptions: "only-dir=models" }

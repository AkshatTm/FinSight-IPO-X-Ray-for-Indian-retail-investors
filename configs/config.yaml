# Profiles from 02_ARCHITECTURE.md section 8. Pick one with FINSIGHT_PROFILE (default dev_light).
# Any value can be overridden by env vars: FINSIGHT_LLM__MODEL=qwen3.5:2b, DEMO_MODE=1, ...
paths:
  data_dir: data
  processed_dir: data/processed
  models_dir: models
  eval_dir: eval_results

profiles:
  dev_light:
    llm: { backend: ollama, model: "qwen3.5:0.8b", num_ctx: 2048 }
    retrieve: { dense: false, rerank: false }
    voice: { asr: "off" }
    verify: { nli: false }
    demo_mode: false

  full:
    # Model names below are placeholders until the P3.2 bake-off (ADR-020).
    llm: { backend: ollama, model: "qwen3.5:2b", num_ctx: 2048 }
    # -4.402: highest hybrid+rerank score that refuses at most 10 % of answerable dev questions (ADR-049)
    retrieve: { dense: true, rerank: true, abstain_thresholds: { "hybrid+rerank": -4.402 } }
    voice: { asr: "faster-whisper-large-v3-turbo" } # ADR-021
    verify: { nli: false } # turns on with P5.5
    demo_mode: false

  deploy_cpu:
    # ADR-022 (pending): BM25 + small rerank + smallest LLM that passes the quality bar.
    llm: { backend: llama-cpp, model: "smallest-passing-gguf", num_ctx: 2048 }
    retrieve: { dense: false, rerank: true, rerank_top_n: 10 }
    voice: { asr: "off" }
    verify: { nli: false }
    demo_mode: true

  cloud:
    # B-ADR-04: Google Cloud Run on CPU (API service + worker job), Supabase Auth + Postgres,
    # GCS storage, Vercel site. Secrets come from env (see .env.example), never from here.
    llm: { backend: llama-cpp, model: "Qwen3.5-2B-Q4_K_M.gguf", num_ctx: 2048 }
    retrieve: { dense: false, rerank: false }
    voice: { asr: "off" }
    verify: { nli: false }
    demo_mode: true
    storage: { backend: gcs }
    db: { backend: postgres }
    auth: { mode: supabase }
    simplify: { backend: llama-cpp, model: "simplifier-q4_k_m.gguf", auto_top_n: 15 }
    jobs: { runner: cloud_run, gpu_job: false }

  cloud_gpu:
    # Optional upgrade: simplify + index run in a Cloud Run L4 job with vLLM (B02 §10.3).
    llm: { backend: llama-cpp, model: "Qwen3.5-2B-Q4_K_M.gguf", num_ctx: 2048 }
    retrieve: { dense: false, rerank: false }
    voice: { asr: "off" }
    verify: { nli: false }
    demo_mode: true
    storage: { backend: gcs }
    db: { backend: postgres }
    auth: { mode: supabase }
    simplify: { backend: vllm, model: "simplifier-awq", auto_top_n: 15 }
    jobs: { runner: cloud_run, gpu_job: true }

# ML and evaluation terms for the docs glossary (docs/glossary.md, generated by scripts/docs_gen.py).
# The finance terms the app shows live in configs/glossary.yaml.
terms:
  - term: Gold set
    body: Answers checked by a person against the document page. Scores are measured against it.
  - term: Weak labels
    body: Training labels made automatically (here, values found on the cover page and searched for in the body). Cheap and plentiful, but some are wrong; the audit measures how many.
  - term: AI-assisted label
    body: A label drafted with an AI model and then checked. Files mark these with `label_source`.
  - term: NVM (normalised value match)
    body: The share of facts whose value matches the gold value after normalising units, case and punctuation (ADR-045).
  - term: EM / F1
    body: Exact match of the answer text, and word-overlap F1 between the answer and the gold text (SQuAD metrics).
  - term: Dev and test split
    body: Dev questions and IPOs are used to choose settings; test ones are used once, for the reported number.
  - term: Seed
    body: The random starting point of a training run. Runs with several seeds show how much the score moves by chance.
  - term: 95 % confidence interval (CI)
    body: The range the true score probably lies in, given how few examples were scored. Small test sets give wide intervals.
  - term: Wilson interval
    body: A confidence interval for a share (hits out of n) that behaves well when n is small or the share is near 0 or 1.
  - term: Bootstrap
    body: Re-drawing the test IPOs many times with replacement to see how much a score would change with a different sample.
  - term: Extractive QA
    body: A model that answers by pointing at a span of the passage, so it can only return text that is in the document.
  - term: BiLSTM-CRF
    body: A sequence tagger that labels each word as the start, inside or outside of a value. Used here as a smaller baseline.
  - term: BM25
    body: A keyword search score. Fast and needs no GPU; the cloud profile uses it for chat retrieval.
  - term: Dense retrieval
    body: Search by meaning with embedding vectors (bge-m3 here); combined with BM25 by reciprocal rank fusion (RRF).
  - term: Reranker
    body: A model that re-orders the top search results by reading the question and passage together.
  - term: Teacher and student
    body: A large model (teacher) writes training examples; a smaller model (student) is fine-tuned on the filtered ones so it can run cheaply.
  - term: QLoRA
    body: Fine-tuning a quantised model by training small adapter matrices only, so it fits on one GPU.
  - term: Quantisation (Q4, AWQ, int8)
    body: Storing weights with fewer bits so a model needs less memory and runs faster, at a small cost in quality.
  - term: GGUF
    body: The file format llama.cpp loads; the student runs from a Q4 GGUF on CPU.
  - term: ONNX
    body: A portable model format; the category classifier runs as fp32 ONNX without PyTorch (int8 was tried and rejected).
  - term: Macro-F1
    body: F1 computed per class and then averaged, so small classes count as much as large ones.
  - term: Spearman ρ
    body: Rank correlation between two lists of scores, from -1 to 1.
  - term: FKGL
    body: Flesch–Kincaid grade level, a readability score; lower means easier to read.
  - term: Abstain
    body: The chat says it could not find the answer instead of guessing, when the best passage scores below a threshold.

# Words on the report pages that the app's glossary drawer (configs/glossary.yaml) does not list.
report_terms:
  - term: SOD (Summary of the Offer Document)
    body: The short chapter near the front of an RHP that sums up the offer, the financials, litigation and related-party dealings. Vidura reads it first; when a document has none, it reads the chapters the summary would have covered.
  - term: Risk factor
    body: One numbered risk the company lists in its "Risk Factors" chapter. A large RHP lists 50 to 100.
  - term: WACA (weighted average cost of acquisition)
    body: The average price the promoters and other selling shareholders paid for their shares. Compared with the offer price in the "What insiders paid" check.
  - term: RoNW (return on net worth)
    body: Profit after tax as a percentage of net worth (shareholders' funds). Higher means more profit per rupee the owners put in.
  - term: NAV per share (net asset value)
    body: Net worth divided by the number of shares; what each share is backed by on the balance sheet.
  - term: EPS (earnings per share)
    body: Profit after tax divided by the number of shares.
  - term: P/E (price to earnings)
    body: The share price divided by EPS. The document compares the issuer's P/E at the offer price with listed peers in its "Basis for Offer Price" chapter.
  - term: PAT and PAT margin
    body: Profit after tax, and profit after tax as a percentage of revenue.
  - term: Debt to equity
    body: Total borrowings divided by net worth. Above 1 means the company owes more than its owners have put in.
  - term: Stub period
    body: A part-year (for example, the first three or six months of the current year) reported next to the last three full fiscal years.
  - term: Promoter holding (pre and post offer)
    body: The share of the company the promoters own before the IPO and after it. "After" is often unknown until the price is set in the final prospectus.
  - term: Red flag
    body: One of 13 rule-based checks on numbers the document discloses. Each says OK, Watch, Concern, Not available (the document does not give the numbers) or Not applicable.
  - term: Serious finding
    body: A disclosed event such as a going-concern doubt, a regulator order or a qualified audit. One about the company itself sets the risk level to High; one about a promoter, director or group company is shown but does not (C-ADR-26).
  - term: Risk level
    body: Low, Medium or High, from red-flag and rare-risk points as a share of the points possible, compared with past Indian IPOs. A summary of what the document discloses, not advice or a prediction.
  - term: Page citation
    body: The page chip next to a number. Clicking it opens the document page the value was read from.
  - term: Verified, unverifiable, contradicted (✅ ⚠️ ❌)
    body: The marks on each number in a chat answer, from the number checker. ✅ the number is on the cited page, ⚠️ it could not be checked, ❌ the page says something else.
  - term: Degraded report
    body: A report where a stage did not finish or ran without one of its models. The report says what is missing; it is never cached as complete.
  - term: Pipeline version
    body: A version string (4.2 at v1.1) stored with every report. A report made by an older version is analysed again when it is opened.

# FinSight docs site (B09 §2). Build: `uv sync --group docs` then `uv run poe docs-build`.
# Reference pages under docs/reference/ and docs/adr/ are generated (`uv run poe docs-gen`).
site_name: FinSight
site_description: IPO X-Ray for Indian retail investors
repo_url: https://github.com/AkshatTm/FinSight-IPO-X-Ray-for-Indian-retail-investors
edit_uri: edit/main/docs/
docs_dir: docs
strict: false

# Session working files (prompts, logs, to-do lists) stay on GitHub only.
exclude_docs: |
  templates/
  screenshots/
  gates/
  07_ROADMAP.md
  11_CLAUDE_CODE_PROMPTS.md
  AKSHAT_TODO.md
  EXECUTION_PLAN.md
  MORNING_REPORT.md
  PROGRESS_PHASE1.md
  PROGRESS_PHASE2.md
  phase2/B10_PROMPTS.md
  phase3/C06_AKSHAT_CHECKLIST.md
  phase3/C07_PROMPTS.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3

hooks:
  - scripts/mkdocs_hooks.py

validation:
  links:
    # The planning docs link to code files outside docs/; those links work on GitHub.
    not_found: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Tutorials:
      - Run FinSight locally: tutorials/run_locally.md
      - Analyse your first IPO document: tutorials/first_document.md
  - How-to guides:
      - Add a showcase IPO: howto/add_showcase_ipo.md
      - Add an X-Ray field: howto/add_xray_field.md
      - Add a red-flag check: howto/add_redflag_check.md
      - Retrain the risk classifier: howto/retrain_classifier.md
      - Retrain the simplifier: howto/retrain_simplifier.md
      - Record the demo cache: howto/record_demo_cache.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - API: reference/api.md
      - Python packages: reference/python.md
      - Configuration and environment variables: reference/config.md
      - Data formats: reference/data_formats.md
      - Red-flag checks: reference/redflags.md
      - Risk level: reference/risklevel.md
      - Compare reference: reference/compare.md
      - Commands: reference/cli.md
      - API contract (B06): phase2/B06_API_CONTRACT.md
      - Glossary: glossary.md
  - Explanation:
      - Architecture: architecture/index.md
      - Architecture design (Phase 2): phase2/B02_ARCHITECTURE.md
      - Architecture design (Phase 1): 02_ARCHITECTURE.md
      - Models and training: phase2/B03_MODELS_AND_TRAINING.md
      - Data and evaluation plan: phase2/B04_DATA_AND_EVALUATION.md
      - Evaluation and results: evaluation.md
      - UI spec: phase2/B05_UI_SPEC.md
      - Design decisions (ADR index): adr/index.md
      - FinSight explained: 10_FINSIGHT_EXPLAINED.md
  - Models and data:
      - Model cards: model_cards/index.md
      - QA extractor: model_cards/extractor_qa.md
      - BiLSTM-CRF: model_cards/bilstm_crf.md
      - Advice guard (MuRIL): model_cards/guard_muril.md
      - Datasheets: datasheets/index.md
      - Training corpus: datasheets/corpus.md
      - Newest IPOs (draft): datasheets/new_ipos.md
      - Weak labels: datasheets/weak_labels.md
      - Gold sets: datasheets/gold_sets.md
      - Teacher outputs: phase2/datasheets/teacher_outputs.md
  - Operations:
      - Rotate secrets: runbooks/ROTATE_SECRETS.md
      - Restore the database: runbooks/RESTORE_DB.md
      - Hosting setup: phase2/HOSTING_SETUP_STEPS.md
  - Phase 3:
      - Overview: phase3/C00_README.md
      - Strategy: phase3/C01_STRATEGY.md
      - Data and time split: phase3/C02_DATA.md
      - Training and compute: phase3/C03_TRAINING.md
      - FinSight Bench: phase3/C04_BENCHMARK.md
      - Roadmap: phase3/C05_ROADMAP.md
      - Execution plan: phase3/C_EXECUTION_PLAN.md
      - Deployment: phase3/C08_DEPLOY.md
      - Decisions (C-ADRs): phase3/C_DECISIONS.md
  - Project:
      - Requirements (Phase 2): phase2/B01_PRD.md
      - Roadmap (Phase 2, history): phase2/B07_ROADMAP.md
      - Changelog: changelog.md
      - Contributing: contributing.md

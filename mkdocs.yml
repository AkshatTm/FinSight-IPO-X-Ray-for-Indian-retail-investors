# FinSight docs site. Build: `uv sync --group docs` then `uv run poe docs-build` (strict).
# Pages marked "Generated" are written by `uv run poe docs-gen` from configs/, eval_results/ and the
# decision logs; CI fails when they are stale. Planning records (Phases 1–4) are not published here:
# they stay on GitHub with a "historical record" banner and docs/history.md links to them.
site_name: FinSight
site_description: IPO X-Ray for Indian retail investors (v1.1)
site_url: https://akshattm.github.io/FinSight-IPO-X-Ray-for-Indian-retail-investors/
repo_url: https://github.com/AkshatTm/FinSight-IPO-X-Ray-for-Indian-retail-investors
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

exclude_docs: |
  templates/
  archive/
  gates/
  final/
  phase4/
  screenshots/*
  !screenshots/final/
  phase2/*
  !phase2/B08_DECISIONS.md
  !phase2/datasheets/
  phase3/*
  !phase3/C_DECISIONS.md
  !phase3/bench_error_analysis.md
  /0[0-8]_*.md
  /1[0-2]_*.md
  EXECUTION_PLAN.md
  AKSHAT_TODO.md
  PROGRESS_PHASE1.md
  PROGRESS_PHASE2.md
  security_review.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3

hooks:
  - scripts/mkdocs_hooks.py

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Run FinSight (start.bat): getting-started/run.md
      - Your first upload: getting-started/first-upload.md
      - Troubleshooting: getting-started/troubleshooting.md
  - User guide:
      - Pages and tabs: user-guide/index.md
      - Reading the results: user-guide/reading-results.md
  - Architecture:
      - System overview: architecture/index.md
      - Pipeline stages: architecture/pipeline.md
      - Storage and database: architecture/storage.md
      - Jobs and the runner: architecture/jobs.md
      - Frontend: architecture/frontend.md
  - Data:
      - Corpus, splits and licences: data/index.md
      - Datasheets: datasheets/index.md
      - Training corpus: datasheets/corpus.md
      - Recent RHPs (2024–2026): datasheets/new_ipos.md
      - Risk bank: datasheets/risk_bank.md
      - Weak labels: datasheets/weak_labels.md
      - Gold sets: datasheets/gold_sets.md
      - Teacher outputs: phase2/datasheets/teacher_outputs.md
  - Models:
      - Overview: model_cards/index.md
      - Field extractor (v1, v2 ablation): model_cards/extractor_qa.md
      - Risk classifier (base vs large): model_cards/risk_classifier.md
      - Plain-English student (4B): model_cards/risk_simplifier.md
      - Reranker and retrieval: model_cards/reranker.md
      - Advice guard (MuRIL, not shipped): model_cards/guard_muril.md
      - BiLSTM-CRF (baseline): model_cards/bilstm_crf.md
  - Evaluation:
      - Results and experiments: evaluation.md
      - FinSight Bench v1: evaluation/bench.md
      - Bench error analysis: phase3/bench_error_analysis.md
      - Reproduce the numbers: evaluation/reproduce.md
  - API reference:
      - Guide with curl: reference/api-guide.md
      - OpenAPI reference: reference/api.md
      - Data formats: reference/data_formats.md
      - Python packages: reference/python.md
  - Configuration:
      - Settings and environment variables: reference/config.md
      - Configuration files: reference/configs.md
      - Red-flag checks: reference/redflags.md
      - Risk level: reference/risklevel.md
      - Compare: reference/compare.md
  - Development:
      - Developer guide: development/index.md
      - Add a red-flag check: development/add-redflag-check.md
      - Add or replace a model: development/add-model.md
      - Commands: reference/cli.md
      - Contributing: contributing.md
  - Operations:
      - Run, back up, restore: operations/index.md
      - Training lanes and compute: operations/training-lanes.md
  - Decisions:
      - ADR index: adr/index.md
      - Phase 1 (ADR): 09_DECISIONS.md
      - Phase 2 (B-ADR): phase2/B08_DECISIONS.md
      - Phase 3, 4 and final (C-ADR): phase3/C_DECISIONS.md
  - Project history:
      - Timeline: history.md
      - Changelog: changelog.md
      - Security: security.md
      - Privacy: privacy.md
  - Glossary: glossary.md
  - FAQ: faq.md
